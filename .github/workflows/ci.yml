name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships Chromium and its Linux packages, so CI never
    # waits on Ubuntu's mirrors (8 minutes for 25 MB on 2026-10-26). Its tag
    # must match @playwright/test in pnpm-lock.yaml; the check below fails if not.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Playwright matches the container image
        run: |
          test "$(node -p 'require("@playwright/test/package.json").version')" = "$PLAYWRIGHT_IMAGE_VERSION" \
            || { echo "Update the container image to @playwright/test's version"; exit 1; }
        env:
          PLAYWRIGHT_IMAGE_VERSION: 1.64.1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
